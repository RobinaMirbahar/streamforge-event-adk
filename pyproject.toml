[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "streamforge-event-adk"
version = "1.0.0"
description = "Real-Time Event-Driven Multi-Agent Pipeline on Google Cloud (Eventarc + Pub/Sub + Cloud Run + Google ADK ParallelAgent & LoopAgent + Gemma 3)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "litellm>=1.60.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "google-cloud-firestore>=2.19.0",
    "google-cloud-storage>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["streamforge_agent*"]
